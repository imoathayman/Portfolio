<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moath Ayman — Full-stack systems developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#5FA8D3; --primary-deep:#2C6E9E; --soft:#B4D3E8;
  --ink:#2B2B28; --ink-2:#726E66; --bg:#FDFCF9; --bg-alt:#F6F1E6;
  --step:30deg; --R:3000px; --cur:0;
  --spin:1100ms; --spin-ease:cubic-bezier(.72,0,.22,1);
  --dur:420ms; --ease:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;overflow:hidden}
.stage{position:relative;height:100dvh;width:100%;overflow:hidden}

.wheel{
  position:absolute;left:50%;top:calc(50% + var(--R));width:0;height:0;
  transform:rotate(calc(var(--cur) * var(--step) * -1));
  transition:transform var(--spin) var(--spin-ease);
}
.panel{
  position:absolute;width:100vw;height:100dvh;
  transform:rotate(calc(var(--i) * var(--step))) translate(0,calc(-1 * var(--R)))
            rotate(calc(var(--i) * var(--step) * -1)) translate(-50%,-50%);
  will-change:transform;
}
.upright{
  position:absolute;inset:0;overflow:hidden;
  transform:rotate(calc(var(--cur) * var(--step)));
  transition:transform var(--spin) var(--spin-ease);
}

.field{position:absolute;bottom:-14vh;inset-inline-end:-6vw;width:min(56vw,860px);height:min(112vh,1020px);
  background:var(--primary);border-radius:46% 54% 40% 60% / 52% 44% 56% 48%;z-index:1}
.field-soft{position:absolute;bottom:-8vh;inset-inline-end:6vw;width:min(44vw,660px);height:min(86vh,800px);
  background:var(--soft);border-radius:58% 42% 52% 48% / 46% 58% 42% 54%;opacity:.55;z-index:0}
.ring{position:absolute;top:50%;inset-inline-end:-16vw;width:min(52vw,720px);aspect-ratio:1;
  border:1px solid var(--soft);border-radius:50%;transform:translateY(-50%);z-index:0}
[dir="rtl"] .field,[dir="rtl"] .field-soft{transform:scaleX(-1)}
.photo{position:absolute;bottom:0;inset-inline-end:4vw;height:min(92vh,880px);width:auto;z-index:2;-webkit-user-drag:none}
[dir="rtl"] .photo{transform:scaleX(-1)}

.content{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:clamp(96px,10vw,180px);
  max-width:min(46vw,540px);z-index:3}
h1{font-size:clamp(38px,4.6vw,64px);line-height:1.16;font-weight:700;letter-spacing:-.01em}
[dir="rtl"] h1{font-size:clamp(34px,4.2vw,58px);line-height:1.34}
.role{margin-top:22px;font-size:19px;font-weight:600;line-height:1.9;min-height:1.9em}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--primary-deep);vertical-align:-3px;
  margin-inline-start:4px;animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
.cta{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;font-weight:600;padding:13px 26px;border-radius:7px;
  border:1.5px solid var(--primary-deep);cursor:pointer;transition:background var(--dur) var(--ease)}
.btn-primary{background:var(--primary-deep);color:#fff}
.btn-primary:hover{background:var(--ink)}
.btn-secondary{background:transparent;color:var(--primary-deep)}
.btn-secondary:hover{background:var(--bg-alt)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.about-arc{position:absolute;bottom:-38vh;inset-inline-end:-14vw;width:min(66vw,900px);aspect-ratio:1;
  border-radius:50%;background:var(--bg-alt);z-index:0}
.about-arc-2{position:absolute;bottom:-30vh;inset-inline-end:-4vw;width:min(44vw,620px);aspect-ratio:1;
  border-radius:50%;border:1px solid var(--soft);z-index:0}
.about-wrap{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:clamp(96px,10vw,180px);
  inset-inline-end:clamp(96px,10vw,180px);z-index:2;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  gap:clamp(40px,6vw,96px);align-items:start}
.lead{font-size:clamp(24px,2.5vw,34px);line-height:1.5;font-weight:700;letter-spacing:-.005em}
.lead em{font-style:normal;color:var(--primary-deep)}
.body{margin-top:24px;font-size:16px;line-height:2;color:var(--ink-2);max-width:520px}
.values{display:grid;gap:22px;padding-top:8px}
.value{border-inline-start:2px solid var(--soft);padding-inline-start:16px;transition:border-color var(--dur) var(--ease)}
.value:hover{border-color:var(--primary-deep)}
.value h3{font-size:15px;font-weight:600;color:var(--ink)}
.value p{font-size:13.5px;line-height:1.8;color:var(--ink-2);margin-top:4px}

.sk-arc{position:absolute;top:-34vh;inset-inline-end:-12vw;width:min(56vw,780px);aspect-ratio:1;
  border-radius:50%;background:var(--bg-alt);z-index:0}
.sk-wrap{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:clamp(96px,10vw,180px);
  inset-inline-end:clamp(96px,10vw,180px);z-index:2}
.sk-lead{font-size:clamp(22px,2.3vw,32px);line-height:1.5;font-weight:700;max-width:24ch;letter-spacing:-.005em}
.sk-lead em{font-style:normal;color:var(--primary-deep)}
.layers{position:relative;margin-top:clamp(28px,4.5vh,52px)}
.layers::before{content:"";position:absolute;inset-inline-start:8px;top:14px;bottom:14px;width:1px;background:var(--soft)}
.layer{position:relative;display:grid;grid-template-columns:17px minmax(120px,150px) minmax(0,1fr);
  gap:clamp(16px,2.2vw,32px);align-items:start;padding:clamp(12px,1.9vh,20px) 0}
.node{width:11px;height:11px;margin-top:7px;margin-inline-start:3px;border-radius:50%;background:var(--bg);
  border:1.5px solid var(--soft);transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.layer:hover .node{background:var(--primary-deep);border-color:var(--primary-deep)}
.lname{font-size:17px;font-weight:600;transition:color var(--dur) var(--ease)}
.layer:hover .lname{color:var(--primary-deep)}
.ldesc{font-size:13.5px;line-height:1.8;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-size:12.5px;font-weight:600;color:var(--ink);border:1px solid var(--soft);border-radius:999px;padding:5px 13px}

.pr-wrap{position:absolute;inset:0;z-index:2;display:grid;place-items:center;align-content:center}
.pr-stage{display:grid;justify-items:center;gap:clamp(64px,9vh,112px);transition:opacity 320ms var(--ease)}
.pr-stage.hide{opacity:0;pointer-events:none}
.pr-row{display:flex;align-items:center;gap:clamp(14px,1.8vw,30px)}
.pr-tile{position:relative;background:var(--soft);border:0;border-radius:26px;cursor:pointer;
  width:clamp(130px,13vw,186px);height:clamp(180px,25vh,238px);padding:0 16px 20px;
  display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;
  transition:transform 520ms var(--spin-ease),background 420ms var(--ease),box-shadow 420ms var(--ease)}
.pr-tile.act{background:var(--primary-deep);transform:scale(1.24);z-index:3}
.pr-tile:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.pr-shot{position:absolute;top:-26px;inset-inline-start:50%;width:86%;transform:translateX(-50%);
  transition:transform 520ms var(--spin-ease)}
[dir="rtl"] .pr-shot{transform:translateX(50%)}
.pr-tile.act .pr-shot{top:-34px}
.pr-tname{font-size:15px;font-weight:700;color:var(--ink);transition:color 420ms var(--ease)}
.pr-tmeta{font-size:10.5px;font-weight:600;color:var(--ink-2);margin-top:3px;letter-spacing:.02em;transition:color 420ms var(--ease)}
.pr-tile.act .pr-tname{color:#fff}
.pr-tile.act .pr-tmeta{color:var(--soft)}
.pr-active{width:min(680px,70vw);text-align:start}
.pr-ahead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pr-aname{font-size:clamp(20px,2.2vw,28px);font-weight:700;letter-spacing:-.01em}
.pr-adesc{font-size:14px;line-height:1.85;color:var(--ink-2);margin-top:8px}
.pr-hint{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;font-weight:600;
  color:var(--primary-deep);margin-top:14px;background:none;border:0;padding:6px 0;cursor:pointer;
  border-bottom:1.5px solid transparent;transition:border-color var(--dur) var(--ease)}
.pr-hint:hover{border-color:var(--primary-deep)}
.pr-hint:focus-visible{outline:2px solid var(--primary-deep);outline-offset:4px}
.win{position:relative;z-index:2;width:100%;background:var(--bg);border:1px solid var(--soft);border-radius:10px;overflow:hidden}
.win-bar{height:20px;background:var(--bg-alt);display:flex;align-items:center;gap:5px;padding:0 9px;border-bottom:1px solid var(--soft)}
.win-bar i{width:5px;height:5px;border-radius:50%;background:var(--soft);display:block}
.win-body{padding:10px;display:grid;gap:7px}
.win-body .l{height:7px;border-radius:3px;background:var(--bg-alt)}
.win-body .l.a{background:var(--soft);width:55%}
.win-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:2px}
.win-grid span{height:30px;border-radius:5px;background:var(--bg-alt)}
.win-grid span:first-child{background:var(--soft)}

.pr-detail{position:absolute;inset:0;z-index:5}
.pr-detail[hidden]{display:none}
.pr-half{position:absolute;top:0;bottom:0;inset-inline-start:0;width:52%;background:var(--primary-deep);
  display:grid;place-items:center;padding:6vh 5vw;transform-origin:0 0}
.pr-half .win{max-width:min(26vw,380px);opacity:0;transition:opacity 170ms var(--ease)}
.pr-detail.open .pr-half .win{opacity:1;transition:opacity 300ms var(--ease) 400ms}
.pr-close{position:absolute;top:clamp(24px,4vh,40px);inset-inline-start:clamp(24px,2.6vw,44px);z-index:8;
  width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;background:var(--bg);color:var(--primary-deep);
  display:grid;place-items:center;opacity:0;transform:scale(.7);
  transition:opacity 180ms var(--ease),transform 180ms var(--ease),background 260ms var(--ease)}
.pr-detail.open .pr-close{opacity:1;transform:none;
  transition:opacity 300ms var(--ease) 420ms,transform 300ms var(--ease) 420ms,background 260ms var(--ease)}
.pr-close:hover{background:var(--primary);color:var(--ink)}
.pr-close:focus-visible{outline:2px solid var(--bg);outline-offset:3px}
.pr-info{position:absolute;top:50%;transform:translateY(-50%) translateY(14px);inset-inline-end:clamp(40px,6vw,110px);
  width:min(38vw,470px);z-index:6;opacity:0;
  transition:opacity 190ms var(--ease),transform 190ms var(--ease)}
.pr-detail.open .pr-info{opacity:1;transform:translateY(-50%);
  transition:opacity 340ms var(--ease) 300ms,transform 340ms var(--ease) 300ms}
.pr-name{font-size:clamp(24px,2.6vw,36px);font-weight:700;letter-spacing:-.01em}
.pr-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pr-role{font-size:13px;font-weight:600;color:var(--primary-deep);margin-top:12px}
.pr-desc{font-size:15px;line-height:1.9;color:var(--ink-2);margin-top:12px}
.pr-metrics{display:flex;gap:clamp(22px,3vw,46px);margin-top:24px;padding-top:20px;border-top:1px solid var(--soft)}
.pr-metric b{display:block;font-size:24px;font-weight:700;color:var(--ink)}
.pr-metric span{font-size:11px;color:var(--ink-2);letter-spacing:.08em}
.pr-foot{margin-top:24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pr-link{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--primary-deep);
  text-decoration:none;border-bottom:1.5px solid transparent;padding-bottom:2px}
.pr-link:hover{border-color:var(--primary-deep)}
[dir="rtl"] .pr-link svg,[dir="rtl"] .pr-hint svg{transform:scaleX(-1)}

.ex-wrap{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:clamp(70px,7vw,140px);
  inset-inline-end:clamp(70px,7vw,140px);z-index:2}
.ex-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.ex-lead{font-size:clamp(20px,2.1vw,29px);line-height:1.5;font-weight:700;max-width:24ch;letter-spacing:-.005em}
.ex-lead em{font-style:normal;color:var(--primary-deep)}
.ex-filters{display:flex;gap:6px}
.ex-filters button{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);background:none;
  border:1px solid var(--soft);border-radius:999px;padding:7px 16px;cursor:pointer;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.ex-filters button.on{background:var(--primary-deep);border-color:var(--primary-deep);color:#fff}
.ex-rail{position:relative;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);
  height:clamp(300px,44vh,420px);margin-top:clamp(18px,3vh,34px)}
.ex-rail::before{content:"";position:absolute;top:50%;inset-inline:0;height:1px;background:var(--soft)}
.ex-track{display:flex;gap:clamp(8px,1.1vw,20px);transition:opacity 380ms var(--ease)}
.ex-top{align-items:flex-end}
.ex-bot{align-items:flex-start}
.ex-rail.f-work .ex-bot,.ex-rail.f-learn .ex-top{opacity:.22}
.ex-card{flex:1;min-width:0;position:relative;padding-inline-end:8px;cursor:default}
.ex-top .ex-card{padding-bottom:28px}
.ex-bot .ex-card{padding-top:28px}
.ex-card::before{content:"";position:absolute;inset-inline-start:5px;width:1px;height:28px;background:var(--soft)}
.ex-top .ex-card::before{bottom:0}
.ex-bot .ex-card::before{top:0}
.ex-card::after{content:"";position:absolute;inset-inline-start:0;width:11px;height:11px;border-radius:50%;
  background:var(--soft);border:2px solid var(--soft);
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.ex-top .ex-card::after{bottom:-6px}
.ex-bot .ex-card::after{top:-6px}
.ex-bot .ex-card::after{background:var(--bg)}
.ex-card:hover::after{background:var(--primary-deep);border-color:var(--primary-deep)}
.ex-year{font-size:11px;letter-spacing:.06em;font-weight:600;color:var(--ink-2)}
.ex-role{font-size:clamp(13px,1.1vw,15.5px);font-weight:700;margin-top:6px;line-height:1.45;
  transition:color var(--dur) var(--ease)}
.ex-card:hover .ex-role{color:var(--primary-deep)}
.ex-org{font-size:12px;font-weight:600;color:var(--ink-2);margin-top:4px;line-height:1.6}
.ex-todo{color:var(--primary-deep);border-bottom:1px dashed var(--primary-deep)}

.ct-field{position:absolute;bottom:-26vh;inset-inline-end:-14vw;width:min(52vw,760px);height:min(96vh,880px);
  background:var(--primary);border-radius:52% 48% 44% 56% / 48% 54% 46% 52%;z-index:0;opacity:.9}
.ct-ring{position:absolute;top:-24vh;inset-inline-start:-12vw;width:min(44vw,600px);aspect-ratio:1;
  border:1px solid var(--soft);border-radius:50%;z-index:0}
.ct-wrap{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:clamp(96px,10vw,180px);
  inset-inline-end:clamp(96px,10vw,180px);z-index:2;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:clamp(40px,6vw,90px);align-items:center}
.ct-lead{font-size:clamp(28px,3.4vw,48px);line-height:1.25;font-weight:700;letter-spacing:-.015em;max-width:14ch}
.ct-sub{font-size:15px;line-height:1.9;color:var(--ink-2);margin-top:16px;max-width:38ch}
.ct-links{margin-top:clamp(24px,3.4vh,38px)}
.ct-link{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;
  border-top:1px solid var(--soft);text-decoration:none;color:var(--ink);
  transition:padding-inline-start var(--dur) var(--ease)}
.ct-link:last-child{border-bottom:1px solid var(--soft)}
.ct-link:hover{padding-inline-start:8px}
.ct-link b{font-size:15px;font-weight:600}
.ct-link span{font-size:11px;letter-spacing:.1em;color:var(--ink-2);display:block;margin-bottom:3px}
.ct-link i{color:var(--primary-deep);display:grid;place-items:center}
[dir="rtl"] .ct-link i svg{transform:scaleX(-1)}
.ct-form{background:var(--bg);border:1px solid var(--soft);border-radius:16px;padding:clamp(22px,3vh,32px)}
.ct-form h3{font-size:16px;font-weight:700}
.ct-field-row{margin-top:18px}
.ct-field-row label{display:block;font-size:11.5px;letter-spacing:.06em;font-weight:600;color:var(--ink-2)}
.ct-field-row input,.ct-field-row textarea{width:100%;font:inherit;font-size:14.5px;color:var(--ink);
  background:none;border:0;border-bottom:1px solid var(--soft);padding:9px 0;margin-top:4px;
  transition:border-color var(--dur) var(--ease)}
.ct-field-row textarea{resize:none;height:62px}
.ct-field-row input:focus,.ct-field-row textarea:focus{outline:0;border-color:var(--primary-deep)}
.ct-send{width:100%;margin-top:26px;font:inherit;font-size:15px;font-weight:600;padding:13px;border-radius:8px;
  border:1.5px solid var(--primary-deep);background:var(--primary-deep);color:#fff;cursor:pointer;
  transition:background var(--dur) var(--ease)}
.ct-send:hover{background:var(--ink);border-color:var(--ink)}
.ct-note{font-size:11.5px;color:var(--ink-2);margin-top:12px;text-align:center}
.ct-done{display:grid;place-items:center;gap:12px;padding:34px 0;text-align:center}
.ct-done div{width:46px;height:46px;border-radius:50%;background:var(--primary-deep);color:#fff;display:grid;place-items:center}
.ct-done p{font-size:15px;font-weight:600}
.ct-foot{position:absolute;bottom:30px;inset-inline-start:clamp(96px,10vw,180px);z-index:2;
  font-size:11.5px;color:var(--ink-2)}

.soon{position:absolute;inset:0;display:grid;place-items:center;gap:18px;color:var(--soft)}
.soon svg{width:52px;height:52px}
.soon p{font-size:13px;letter-spacing:.18em;color:var(--ink-2)}

.chrome{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:1;transition:opacity 340ms var(--ease)}
body.detail-open .chrome{opacity:0;pointer-events:none}
body.detail-open .chrome>*{pointer-events:none}
.chrome>*{pointer-events:auto}
.brand{position:absolute;top:38px;inset-inline-start:clamp(32px,5vw,90px);display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--primary);display:grid;place-items:center;
  font-weight:700;font-size:14px;color:var(--ink)}
.brand span{font-size:14px;font-weight:600}
.lang{position:absolute;top:40px;inset-inline-end:clamp(32px,5vw,90px);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.lang button{font:inherit;background:none;border:0;cursor:pointer;color:var(--ink);opacity:.5;padding:4px 2px}
.lang button.on{opacity:1;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.dock{position:absolute;top:50%;inset-inline-start:clamp(30px,4.4vw,74px);transform:translateY(-50%);
  display:flex;flex-direction:column;gap:26px}
.dock button{position:relative;width:22px;height:22px;padding:0;border:0;background:none;cursor:pointer;
  color:var(--soft);display:grid;place-items:center;transition:color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.dock button:hover{color:var(--primary)}
.dock button[aria-current="true"]{color:var(--primary-deep);transform:scale(1.12)}
.dock button:focus-visible{outline:2px solid var(--primary-deep);outline-offset:6px;border-radius:4px}
.dock .tip{position:absolute;inset-inline-start:calc(100% + 14px);white-space:nowrap;font-size:12px;font-weight:600;
  color:var(--ink-2);opacity:0;transition:opacity var(--dur) var(--ease);pointer-events:none}
.dock button:hover .tip,.dock button:focus-visible .tip{opacity:1}
.counter{position:absolute;bottom:34px;inset-inline-start:clamp(32px,5vw,90px);font-size:11px;letter-spacing:.16em;color:var(--ink-2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .wheel,.upright{transition:none}
  .caret{display:none}
}
@media (max-width:900px){
  .content{inset-inline-start:clamp(24px,6vw,48px);max-width:74vw;top:32%}
  .field{width:96vw;height:70vh;bottom:-14vh;inset-inline-end:-24vw}
  .field-soft,.ring{display:none}
  .photo{height:50vh;inset-inline-end:-6vw}
  .about-wrap{inset-inline-start:24px;inset-inline-end:24px}

  if(busy||i===cur||i<0||i>5)return;

}

  const c=pool[Math.floor(Math.random()*pool.length)];
  sessionStorage.setItem('lastHook',c);return c;
}
async function typeLoop(t){
  const el=document.getElementById('role'),list=roles[lang],rtl=lang==='ar';
  if(reduced){el.textContent=list[0];return;}
  let i=0;
  while(t===token){
    const text=list[i%list.length],units=rtl?text.split(' '):[...text],j=rtl?' ':'';
    for(let n=1;n<=units.length;n++){if(t!==token)return;el.textContent=units.slice(0,n).join(j);await sleep(rtl?150:55);}

    for(let n=units.length-1;n>=0;n--){if(t!==token)return;el.textContent=units.slice(0,n).join(j);await sleep(rtl?70:28);}
    await sleep(280);i++;

    '<div class="ct-field-row"><label for="cf2">'+ct.f[1]+'</label><input id="cf2" type="email"></div>'+
    '<div class="ct-field-row"><label for="cf3">'+ct.f[2]+'</label><textarea id="cf3"></textarea></div>'+
    '<button class="ct-send" id="ct-send">'+ct.send+'</button><p class="ct-note">'+ct.note+'</p>';
  document.getElementById('ct-send').addEventListener('click',()=>{
    document.getElementById('ct-form').innerHTML='<div class="ct-done"><div>'+
      '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5l3.5 3.5 7.5-8"/></svg>'+
      '</div><p>'+ct.done+'</p></div>';
  });
  const ex=exp[k];
  document.getElementById('ex-lead').innerHTML=ex.lead;
  const card=it=>'<div class="ex-card"><p class="ex-year'+(it.todo?' ex-todo':'')+'">'+it.y+'</p>'+
    '<p class="ex-role">'+it.r+'</p><p class="ex-org">'+it.o+'</p></div>';
  document.getElementById('ex-top').innerHTML=ex.work.map(card).join('');
  document.getElementById('ex-bot').innerHTML=ex.learn.map(card).join('');
  document.getElementById('ex-filters').innerHTML=ex.filters.map((f,n)=>
    '<button data-f="'+n+'"'+(n===0?' class="on"':'')+'>'+f+'</button>').join('');
  [...document.querySelectorAll('#ex-filters button')].forEach(b=>b.addEventListener('click',()=>{
    [...document.querySelectorAll('#ex-filters button')].forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const rail=document.getElementById('ex-rail');
    rail.classList.remove('f-work','f-learn');
    if(b.dataset.f==='1')rail.classList.add('f-work');
    if(b.dataset.f==='2')rail.classList.add('f-learn');
  }));
  renderProjects();
  document.querySelectorAll('.soon').forEach(el=>{el.innerHTML=svg(el.dataset.g,52)+'<p>'+c.soon+'</p>';});
  buildDock();
  token++;document.getElementById('role').textContent='';typeLoop(token);
}
const CLOSE_ICON='<svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 5l8 8M13 5l-8 8"/></svg>';
let actIdx=1,openIdx=null;

function renderProjects(){
  const list=projects[lang],row=document.getElementById('pr-row');
  row.innerHTML=list.map((p,i)=>
    '<button class="pr-tile" data-i="'+i+'"><div class="pr-shot">'+winHTML+'</div>'+
    '<span class="pr-tname">'+p.name+'</span><span class="pr-tmeta">'+p.chips.slice(0,2).join(' · ')+'</span></button>').join('');
  const tiles=[...row.querySelectorAll('.pr-tile')];
  tiles.forEach((t,i)=>{
    t.addEventListener('mouseenter',()=>setActive(i));
    t.addEventListener('focus',()=>setActive(i));
    t.addEventListener('click',()=>{actIdx===i?openProject(i):setActive(i)});
  });
  actIdx=Math.min(actIdx,list.length-1);
  setActive(actIdx);
  document.getElementById('pr-close').innerHTML=CLOSE_ICON;
  document.getElementById('pr-detail').hidden=true;
}

function setActive(i){
  actIdx=i;
  const p=projects[lang][i];
  [...document.querySelectorAll('.pr-tile')].forEach((t,n)=>t.classList.toggle('act',n===i));
  document.getElementById('pr-active').innerHTML=
    '<div class="pr-ahead"><span class="pr-aname">'+p.name+'</span></div>'+
    '<p class="pr-adesc">'+p.desc+'</p>'+
    '<button class="pr-hint" id="pr-hint">'+(lang==='ar'?'شوف التفاصيل':'View details')+svg('contact',13)+'</button>';
  document.getElementById('pr-hint').addEventListener('click',()=>openProject(actIdx));
}

function flipTo(half,rect){
  const h=half.getBoundingClientRect();
  return 'translate('+(rect.left-h.left)+'px,'+(rect.top-h.top)+'px) scale('+(rect.width/h.width)+','+(rect.height/h.height)+')';
}

function openProject(i){
  const p=projects[lang][i],detail=document.getElementById('pr-detail'),half=document.getElementById('pr-half'),
        stage=document.getElementById('pr-stage'),tile=document.querySelectorAll('.pr-tile')[i],arrow=svg('contact',14);
  openIdx=i;
  half.innerHTML=winHTML;
  document.getElementById('pr-info').innerHTML=
    '<div class="pr-head"><span class="pr-name">'+p.name+'</span></div>'+
    '<p class="pr-role">'+p.role+'</p><p class="pr-desc">'+p.desc+'</p>'+
    '<div class="pr-metrics">'+p.metrics.map(m=>'<div class="pr-metric"><b>'+m[0]+'</b><span>'+m[1]+'</span></div>').join('')+'</div>'+
    '<div class="pr-foot"><div class="chips">'+p.chips.map(c=>'<span class="chip">'+c+'</span>').join('')+'</div>'+
    '<a class="pr-link" href="'+(p.url||'#')+'"'+(p.url?' target="_blank" rel="noopener"':'')+'>'+p.link+arrow+'</a></div>';
  detail.hidden=false;detail.classList.remove('open');
  half.style.transition='none';
  half.style.transform=flipTo(half,tile.getBoundingClientRect());
  half.style.borderRadius='26px';
  requestAnimationFrame(()=>{
    half.style.transition='transform 620ms var(--spin-ease),border-radius 620ms var(--spin-ease)';
    half.style.transform='none';half.style.borderRadius='0';
    detail.classList.add('open');stage.classList.add('hide');document.body.classList.add('detail-open');
  });
}

function closeProject(instant){
  const detail=document.getElementById('pr-detail'),half=document.getElementById('pr-half'),
        stage=document.getElementById('pr-stage');
  document.body.classList.remove('detail-open');
  if(instant||openIdx===null||detail.hidden){detail.hidden=true;detail.classList.remove('open');stage.classList.remove('hide');openIdx=null;return;}
  const tile=document.querySelectorAll('.pr-tile')[openIdx];
  detail.classList.remove('open');
  stage.classList.remove('hide');
  half.style.transition='transform 560ms var(--spin-ease),border-radius 560ms var(--spin-ease)';
  half.style.transform=flipTo(half,tile.getBoundingClientRect());
  half.style.borderRadius='26px';
  setTimeout(()=>{detail.hidden=true;half.style.transition='none';half.style.transform='none';openIdx=null;},580);
}
document.getElementById('pr-close').addEventListener('click',()=>closeProject());
addEventListener('keydown',e=>{if(e.key==='Escape')closeProject();});
document.getElementById('btn-en').addEventListener('click',()=>apply('en'));
document.getElementById('btn-ar').addEventListener('click',()=>apply('ar'));
addEventListener('keydown',e=>{
  if(e.key==='h'||e.key==='H')document.getElementById('headline').innerHTML=pickHook();
  if(e.key==='ArrowDown')go(cur+1);
  if(e.key==='ArrowUp')go(cur-1);
});
sizeWheel();apply('en');
</script>
</body>
